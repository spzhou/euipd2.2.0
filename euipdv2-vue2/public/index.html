<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta charset="utf-8"/>
    <meta name="description" content="集成产品研发管理系统,EUIPD,产品研发,产品运营,IPD,机器人,人工智能,AI,集成产品,高科技,新质生产力,产能升级,科技创新,卡脖子技术">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>EUIPD-产品研发管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

    <!-- bootstrap & fontawesome -->
    <link rel="stylesheet" href="<%= BASE_URL %>static/css/bootstrap.css"/>
    <link rel="stylesheet" href="<%= BASE_URL %>font-awesome/css/font-awesome.min.css">

    <!-- ace styles -->
    <link rel="stylesheet" href="<%= BASE_URL %>static/css/ace.mini.css"/>

    <!--  自定义CSS  -->
    <link rel="stylesheet" href="<%= BASE_URL %>static/css/style.css" type="text/css">
    <!-- 侧边栏样式由 admin-v2 / MenuItem 的 scss import 编译注入，勿直接链 .scss -->

    <!--  打印CSS  -->
    <link rel="stylesheet" href="<%= BASE_URL %>static/css/print.css" type="text/css">

    <!--  通用工具类  -->
    <script src="<%= BASE_URL %>static/js/tool.js"></script>
    <!--  V3.0 权限工具类（模块级权限管理） -->
    <script src="<%= BASE_URL %>static/js/permission-util.js"></script>
    <!--  UUID工具类  -->
    <script src="<%= BASE_URL %>static/js/uuid.js"></script>
    <!--  校验类  -->
    <script src="<%= BASE_URL %>static/js/validator.js"></script>
    <!--  枚举常量  -->
    <script src="<%= BASE_URL %>static/js/enums.js"></script>
    <script src="<%= BASE_URL %>static/rdms/js/enums.js"></script>
    <script src="<%= BASE_URL %>static/rdms/js/enums2.js"></script>
    <!--  角色可见性标准化（依赖 USER_ROLE 语义码；侧栏/页内 Tab） -->
    <script src="<%= BASE_URL %>static/js/role-access.js"></script>
    <!--程序运行全局配置变量-->
    <script src="<%= BASE_URL %>global.js"></script>
    <!--  正则表达式校验  -->
    <script src="<%= BASE_URL %>static/js/pattern.js"></script>
    <!--  h5缓存  -->
    <script src="<%= BASE_URL %>static/js/session-storage.js"></script>
    <script src="<%= BASE_URL %>static/js/local-storage.js"></script>

    <!--  确认框和提示框  -->
    <script src="<%= BASE_URL %>static/js/toast.js"></script>
    <script src="<%= BASE_URL %>static/js/confirm.js"></script>
    <!--  规划开发版本（依赖 Toast，须放其后；组件侧优先 import src/utils） -->
    <script src="<%= BASE_URL %>static/js/dev-version-util.js"></script>

    <!--  md5工具类  -->
    <script src="<%= BASE_URL %>static/js/md5.js"></script>

    <!-- jQuery 由 main.js 引入，避免 CDN 重复阻塞首屏 -->
    <!-- Aliplayer / 阿里云上传：见 lazy-sdk.js，业务触发时再加载 -->
    <script src="<%= BASE_URL %>static/js/lazy-sdk.js"></script>
</head>
<body>
<noscript>
    <strong>We're sorry but admin doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app-index"></div>
<!-- built files will be auto injected -->
</body>
</html>
