# EUIPD 统一入口：前端页面、后端接口、对象存储与 Collabora 共用同一地址与端口
#
# 上游一律写成变量并经 Docker 内置 DNS 解析：容器重建后地址会变化，
# 写死主机名时 nginx 只在启动时解析一次；未启用 Collabora 时 nginx 也能正常启动。

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 去掉 /api 前缀并保留客户端原始编码与查询串
map $request_uri $api_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default /;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    set $gateway_upstream  gateway:18000;
    set $minio_upstream    minio:9000;
    set $collabora_upstream collabora:9980;

    # ---------- 后端接口：去掉 /api 前缀后交给网关 ----------
    # WOPI 回调只供 Collabora 在内部网络调用，不对浏览器开放
    location ^~ /api/file/wopi/ {
        return 403;
    }
    location ^~ /api/ {
        proxy_pass http://$gateway_upstream$api_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ---------- 对象存储：Host 与路径原样转发，预签名地址才能通过校验 ----------
    location ~ ^/(euipd-doc|euipd-web)(/|$) {
        proxy_pass http://$minio_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- Collabora 在线查看 ----------
    # 转换与监控接口只供内部网络调用
    location ^~ /cool/convert-to {
        return 403;
    }
    location ^~ /cool/getMetrics {
        return 403;
    }
    location ~ ^/cool/(.*)/ws$ {
        proxy_pass http://$collabora_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
    }
    # 普通前缀匹配，让上面的 WebSocket 正则优先生效
    location /cool/ {
        proxy_pass http://$collabora_upstream;
        proxy_set_header Host $http_host;
    }
    location ^~ /browser/ {
        proxy_pass http://$collabora_upstream;
        proxy_set_header Host $http_host;
    }
    location ^~ /hosting/ {
        proxy_pass http://$collabora_upstream;
        proxy_set_header Host $http_host;
    }

    # ---------- 前端页面（history 路由，未知路径回落到 index.html） ----------
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
