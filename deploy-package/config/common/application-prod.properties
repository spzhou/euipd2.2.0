# =====================================================================
# 全部后端服务共用的生产配置，覆盖 jar 内的同名配置项。
# ${...} 取自容器环境变量，变量值在 .env 中维护，本文件不写口令与密钥。
# =====================================================================

# 容器内监听全部地址，由 nginx 与网关在内部网络中访问
server.address=0.0.0.0

# ---------- 数据库（应用专用账号 euipd，由 MySQL 容器首次初始化时创建） ----------
spring.datasource.url=jdbc:mysql://mysql:3306/mycourse_bk?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=euipd
spring.datasource.password=${EUIPD_DB_PASSWORD}

# ---------- Redis ----------
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=${EUIPD_REDIS_PASSWORD}

# ---------- 对象存储（MinIO 经 nginx 以同一地址对浏览器与服务端开放，预签名地址才能通过校验） ----------
oss.accessKeyId=${EUIPD_OSS_ACCESS_KEY_ID}
oss.accessKeySecret=${EUIPD_OSS_ACCESS_KEY_SECRET}
oss.endpoint=${EUIPD_PUBLIC_URL}
oss.bucket=euipd-doc
oss.bucket_web=euipd-web
oss.domain=${EUIPD_PUBLIC_URL}/euipd-doc/
oss.domain_web=${EUIPD_PUBLIC_URL}/euipd-web/
oss.domain.vod=${EUIPD_PUBLIC_URL}/euipd-web/
oss.default_cover_image=${oss.domain_web}image/yanjiangpaiqi.png

# ---------- 令牌签名密钥（由 euipd.sh init 在 keys/ 下生成） ----------
euipd.security.jwt.issuer=euipd-auth
euipd.security.jwt.private-key-location=file:/app/keys/jwt-private.pem
euipd.security.jwt.public-key-location=file:/app/keys/jwt-public.pem
euipd.security.service-auth-enabled=true
euipd.security.tenant-sql-filter-enabled=true
euipd.security.tenant.select-filter-enabled=false
euipd.security.tenant.subquery-filter-enabled=false

# ---------- 日志 ----------
# 开发配置将 SQL 映射器设为 trace，生产环境下调为 info，避免日志暴涨与业务数据落盘
logging.level.com.course.server.mapper=info
logging.level.root=info
