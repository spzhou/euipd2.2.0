# 网关生产配置。路由列表整体替换 jar 内配置，四条路由须全部列出。
logging.file.path=./logs/gateway

# 由 nginx 写入真实客户端地址；网关不再追加自身来源地址，
# 否则登录限流等按 X-Forwarded-For 取址的逻辑会取到 nginx 容器地址
spring.cloud.gateway.x-forwarded.for-enabled=false

spring.cloud.gateway.routes[0].id=system
spring.cloud.gateway.routes[0].uri=http://system:18001
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args[0]=/system/**
spring.cloud.gateway.routes[0].filters[0].name=JwtScope
spring.cloud.gateway.routes[0].filters[0].args[0]=true

spring.cloud.gateway.routes[1].id=file
spring.cloud.gateway.routes[1].uri=http://file2:18003
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args[0]=/file/**
spring.cloud.gateway.routes[1].filters[0].name=JwtScope
spring.cloud.gateway.routes[1].filters[0].args[0]=true

spring.cloud.gateway.routes[2].id=customer
spring.cloud.gateway.routes[2].uri=http://customer:18005
spring.cloud.gateway.routes[2].predicates[0].name=Path
spring.cloud.gateway.routes[2].predicates[0].args[0]=/customer/**
spring.cloud.gateway.routes[2].filters[0].name=JwtScope
spring.cloud.gateway.routes[2].filters[0].args[0]=true

spring.cloud.gateway.routes[3].id=ftp
spring.cloud.gateway.routes[3].uri=http://ftp:18007
spring.cloud.gateway.routes[3].predicates[0].name=Path
spring.cloud.gateway.routes[3].predicates[0].args[0]=/ftp/**
spring.cloud.gateway.routes[3].filters[0].name=JwtScope
spring.cloud.gateway.routes[3].filters[0].args[0]=true
