# file2 服务（应用名 file）生产配置
logging.file.path=./logs/file
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# 档案申请转到 customer 的流程入口
rdms.flow.customer-base-url=http://customer:18005/customer

# Collabora：服务端转换走内部地址，浏览器查看页经 nginx 同源访问
rdms.rich.collabora.url=http://collabora:9980
rdms.rich.collabora.public-url=${EUIPD_PUBLIC_URL}
rdms.rich.wopi.base-url=http://file2:18003/file/wopi/files
# WOPI 回调只接受内部网络（Collabora 所在网段）的来源；nginx 已拒绝外部访问 /api/file/wopi/
rdms.rich.wopi.allowed-hosts=${EUIPD_DOCKER_SUBNET_PREFIX}.

# 软删附件对象清理（每日 03:30）：缺省关闭；开启后先保持试运行，核对日志中的待删对象后再关闭试运行
rdms.file.purge.enabled=false
rdms.file.purge.retention-days=180
rdms.file.purge.dry-run=true
