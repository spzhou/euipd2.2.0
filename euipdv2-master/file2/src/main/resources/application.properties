spring.profiles.active=dev
#spring.profiles.active=prod
server.port=18003
server.address=127.0.0.1
# JWT 与网关转发的 X-Scopes 随权限数增长，默认 8KB 不够
server.max-http-header-size=32KB
# 软删附件对象清理：缺省关闭；开启后缺省试运行，只记日志不删对象
rdms.file.purge.enabled=false
rdms.file.purge.retention-days=180
rdms.file.purge.dry-run=true

## MinIO（S3 兼容）。配置键名仍用 oss.* 以兼容租户配置表与既有代码
## Docker Compose：API http://127.0.0.1:18100  Console http://127.0.0.1:18101
oss.accessKeyId=${EUIPD_OSS_ACCESS_KEY_ID}
oss.accessKeySecret=${EUIPD_OSS_ACCESS_KEY_SECRET}
oss.endpoint=${EUIPD_OSS_ENDPOINT:http://127.0.0.1:18100}
oss.domain=${oss.endpoint}/euipd-doc/
oss.domain_web=${oss.endpoint}/euipd-web/
oss.default_cover_image=${oss.domain_web}image/yanjiangpaiqi.png
oss.bucket=euipd-doc
oss.bucket_web=euipd-web

# vod：阿里云点播仍为独立云服务；本地仅文件对象存储走 MinIO
oss.domain.vod=${oss.endpoint}/euipd-web/
## 阿里云视频点播（可选）：视频上传使用，不使用时保持为空
vod.accessKeyId=${EUIPD_VOD_ACCESS_KEY_ID:}
vod.accessKeySecret=${EUIPD_VOD_ACCESS_KEY_SECRET:}
vod.regionId=${EUIPD_VOD_REGION_ID:cn-shanghai}
vod.categoryId=${EUIPD_VOD_CATEGORY_ID:}
vod.workflowId=${EUIPD_VOD_WORKFLOW_ID:}
vod.storageLocation=${EUIPD_VOD_STORAGE_LOCATION:}
