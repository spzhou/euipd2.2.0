<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  公文字体映射：docx 中使用 GB/T 9704 常用字体名称，渲染时映射到可自由分发的开源字体。
  方正小标宋简体 → 思源宋体 Heavy；仿宋_GB2312 → 朱雀仿宋；楷体_GB2312 → 霞鹜文楷；黑体 → 思源黑体；宋体 → 思源宋体。
-->
<fontconfig>
  <alias binding="same">
    <family>方正小标宋简体</family>
    <prefer>
      <family>Source Han Serif SC Heavy</family>
      <family>Source Han Serif SC</family>
      <family>Source Han Serif CN Heavy</family>
      <family>Source Han Serif CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>方正小标宋简体</string></test>
    <edit name="weight" mode="assign"><const>heavy</const></edit>
  </match>
  <alias binding="same">
    <family>仿宋_GB2312</family>
    <prefer>
      <family>Zhuque Fangsong (technical preview)</family>
      <family>朱雀仿宋（预览测试版）</family>
      <family>LXGW WenKai</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>仿宋</family>
    <prefer>
      <family>Zhuque Fangsong (technical preview)</family>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>楷体_GB2312</family>
    <prefer>
      <family>LXGW WenKai</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>楷体</family>
    <prefer>
      <family>LXGW WenKai</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer>
      <family>Source Han Sans SC</family>
      <family>Source Han Sans CN</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer>
      <family>Source Han Serif SC</family>
      <family>Source Han Serif CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
