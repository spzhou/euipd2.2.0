spring.application.name=system
server.servlet.context-path=/system
server.port=18001
server.address=127.0.0.1

#logbock
logging.file.path=./logs/system

web.root.page=${EUIPD_WEB_ROOT:http://localhost:8080/}


euipd.security.service-auth-enabled=true
euipd.security.tenant-sql-filter-enabled=true
euipd.security.tenant.select-filter-enabled=false
euipd.security.tenant.subquery-filter-enabled=false
euipd.security.jwt.access-token-ttl-seconds=1800
euipd.security.jwt.refresh-token-ttl-seconds=28800
euipd.security.jwt.refresh-token-max-lifetime-seconds=86400
