spring.application.name=customer
server.servlet.context-path=/customer
server.port=18005
server.address=127.0.0.1

#logbock
logging.file.path=./logs/customer

euipd.security.service-auth-enabled=true
euipd.security.tenant-sql-filter-enabled=true
euipd.security.tenant.select-filter-enabled=false
euipd.security.tenant.subquery-filter-enabled=false

# 特性全生命周期 To-Be 配置（说明书 §19.2）
rdms.review.require-workers=true
rdms.review.require-bom=true
rdms.review.allow-chair-without-all-coo=false
rdms.review.supplement-set-character-review=true
rdms.milestone.cycle-task.enabled=false
rdms.project.converted-require-setuped=true
rdms.timer.month-account.enabled=true
rdms.timer.plan-task-issue.enabled=true
rdms.budget.pool.over-allocate-policy=REJECT

# 流程双轨开关。按业务码逐个放开，缺省为空即全部走原代码。
# 单独的业务码表示全部机构；机构标识:业务码 只放开该机构。生产与开发基线一致，对全部机构放开费用、档案、质量、物料、工单主干、评审与九条主线。
rdms.flow.enabled-biz-codes=FEE_APPLY,FILE_APPLY,QUALITY,MATERIAL,MATERIAL_RETURN,JOB_ITEM,REVIEW,DEMAND,CHARACTER,PRE_PROJECT,PROJECT_SETUP,DECOMPOSE,DEVELOP,CLOSEOUT,PRODUCT,REVISION
# 待办收口与过程查询各自独立，关闭其一不影响业务码开关。
rdms.flow.todo-unified=true
rdms.flow.history-read=true
# 节点时限由本进程定时扫描。不打开 Flowable 异步作业执行器。
rdms.flow.timer-scan=true
# 修订确认与修订合入是否建 HISTORY 留档记录。关闭后修订前属性以特性版本表为准，关闭前须已执行版本表存量回填。
rdms.version.history-record.enabled=true

# 流程引擎。仅 customer 进程内嵌 Flowable，复用本进程的数据源与事务管理器。
# ACT_ 表由引擎按此开关建立；未启用 IDM 与事件注册引擎，不建对应的表。
flowable.database-schema-update=true
flowable.async-executor-activate=false
flowable.check-process-definitions=false
flowable.idm.enabled=false
flowable.eventregistry.enabled=false
flowable.history-level=audit
