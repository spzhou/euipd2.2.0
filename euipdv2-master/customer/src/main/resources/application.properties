spring.profiles.active=dev
#spring.profiles.active=prod
server.port=18005
server.address=127.0.0.1
# JWT 与网关转发的 X-Scopes 随权限数增长，默认 8KB 不够
server.max-http-header-size=32KB

# 富文本读取接口回填图片签名地址，与 file2 使用同一存储配置
oss.accessKeyId=${EUIPD_OSS_ACCESS_KEY_ID}
oss.accessKeySecret=${EUIPD_OSS_ACCESS_KEY_SECRET}
oss.endpoint=${EUIPD_OSS_ENDPOINT:http://127.0.0.1:18100}
oss.domain=${oss.endpoint}/euipd-doc/
oss.domain_web=${oss.endpoint}/euipd-web/
oss.bucket=euipd-doc
oss.bucket_web=euipd-web
