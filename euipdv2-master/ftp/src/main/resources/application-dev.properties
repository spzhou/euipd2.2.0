spring.application.name=ftp
server.servlet.context-path=/ftp
server.port=18007
server.address=127.0.0.1

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#logbock
logging.file.path=./logs/ftp


euipd.security.tenant-sql-filter-enabled=true
euipd.security.tenant.select-filter-enabled=true
euipd.security.tenant.subquery-filter-enabled=true
euipd.security.service-auth-enabled=true
