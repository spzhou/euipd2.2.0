# 精确匹配：请求路径与条目相同才免鉴权
whitelist:
  - /system/rdms/user/reset-password
  - /system/rdms/sms/send
  - /system/auth2/getToken
  - /system/auth/login
  - /system/auth/refresh
  - /system/auth/logout
  - /system/auth/jwks
  - /system/auth/public-key
  - /system/auth/tenant/switch
  - /system/auth/password
  - /system/auth/password/initial

# 前缀匹配：请求路径以条目开头即免鉴权。条目以 / 结尾，其后只接路径参数或下级路径
whitelist-prefixes:
  - /system/rdms/user/login-salt/
  - /system/rdms/user/list-customer/
  - /system/rdms/customer/get-customer-by-loginname/
  - /system/rdms/kaptcha/
  # 登录页介绍视频的播放凭证
  - /system/vod/
  # WOPI 由 Collabora 回调，不带用户令牌；file2 校验一次性查看凭证与来源地址
  - /file/wopi/
